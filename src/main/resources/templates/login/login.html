<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../static/login/login.css">

</head>
<body>
<div class="position-relative">
  <a class="create-account-btn" th:href="@{/register}">Create Account</a>
  <div class="login-box">
    <div class="header-section">
      <div class="icon-placeholder">
        🔒
      </div>
      <p class="text-muted small">Welcome back</p>
      <h3>USER LOGIN</h3>
    </div>
    <form th:action="@{/login}" method="post">
      <div class="mb-3">
        <input type="text" class="form-control" name="username" placeholder="Email or Username" required>
      </div>
      <div class="mb-3">
        <input type="password" class="form-control" name="password" placeholder="Password" required>
      </div>
      <div class="mb-3 link-line">
        <div>
          <input type="checkbox" id="remember" name="remember-me">
          <label for="remember">Remember</label>
        </div>
        <a href="#" class="text-decoration-none">Forgot password?</a>
      </div>
      <div class="d-grid">
        <button type="submit" class="btn btn-primary">LOGIN</button>
      </div>
    </form>
  </div>
</div>
</body>
</html>
