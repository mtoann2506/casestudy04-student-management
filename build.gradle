plugins {
    id 'java'
    id 'org.springframework.boot' version '2.7.14'
    id 'io.spring.dependency-management' version '1.0.15.RELEASE'
}

group 'com.codegym'
version '1.0-SNAPSHOT'

java {
    sourceCompatibility = '11'
    targetCompatibility = '11'
}

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

dependencies {
    // Spring Web MVC
    implementation 'org.springframework:spring-webmvc:5.3.23'

    // Servlet API
    providedCompile 'javax.servlet:javax.servlet-api:4.0.1'
    
    // JSP Support - Better TLD handling
    implementation 'org.apache.tomcat.embed:tomcat-embed-jasper:9.0.65'
    implementation 'javax.servlet.jsp:javax.servlet.jsp-api:2.3.3'

    // JSP (optional, nếu bạn dùng JSP)
    implementation 'javax.servlet:jstl:1.2'

    // Thymeleaf (nếu dùng Thymeleaf)
    implementation 'org.thymeleaf:thymeleaf:3.1.0.RELEASE'
    implementation 'org.thymeleaf:thymeleaf-spring5:3.1.1.RELEASE'

    // Spring Data JPA + Hibernate
    implementation 'org.springframework:spring-orm:5.3.33'
    implementation 'org.hibernate:hibernate-core:5.6.10.Final'

    // Driver kết nối MySQL
    implementation 'mysql:mysql-connector-java:8.0.33'

    // Apache Commons FileUpload (upload ảnh)
    implementation 'commons-fileupload:commons-fileupload:1.4'

    // Apache POI (đọc file Excel)
    implementation 'org.apache.poi:poi:5.2.5'
    implementation 'org.apache.poi:poi-ooxml:5.2.5'

    // Logging - Updated to compatible versions
    implementation 'org.slf4j:slf4j-api:1.7.36'
    implementation 'org.apache.logging.log4j:log4j-core:2.20.0'
    implementation 'org.apache.logging.log4j:log4j-slf4j-impl:2.20.0'
    implementation 'org.apache.logging.log4j:log4j-api:2.20.0'
    
    // Exclude conflicting logging from other dependencies
    configurations.all {
        exclude group: 'commons-logging', module: 'commons-logging'
        exclude group: 'org.springframework', module: 'spring-jcl'
    }

    // JSTL (nếu dùng JSP View)
    implementation 'javax.servlet:jstl:1.2'

    // Test (optional)
    testImplementation 'junit:junit:4.13.2'

    // Validation
    implementation 'org.hibernate.validator:hibernate-validator:6.2.5.Final'

    // Jackson for JSON
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.13.4'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.13.4'

    // Spring Data JPA (quan trọng!)
    implementation 'org.springframework.data:spring-data-jpa:2.7.0'
    
    // Spring Security
    implementation group: 'org.springframework.security', name: 'spring-security-web', version: '5.8.0'
    implementation group: 'org.springframework.security', name: 'spring-security-config', version: '5.8.0'
    implementation group: 'org.springframework.security', name: 'spring-security-taglibs', version: '5.8.0'
}

test {
    useJUnitPlatform()
}

// Cấu hình Gretty để chạy ứng dụng
gretty {
    httpPort = 8080
    contextPath = '/student-management'
    servletContainer = 'tomcat9'
}
